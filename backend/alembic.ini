[alembic]
script_location = alembic
prepend_sys_path = .
# 占位，实际 URL 由 alembic/env.py 从 app.config.settings 注入
sqlalchemy.url = postgresql+asyncpg://hpf:hpf@localhost:5432/hpf_work

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
