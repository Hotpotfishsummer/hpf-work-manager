[project]
name = "hpf-work-manager-backend"
version = "0.1.0"
description = "Task/Project management & progress tracking API (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "PyJWT>=2.9",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "mcp>=1.10,<2",
    "sse-starlette>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
