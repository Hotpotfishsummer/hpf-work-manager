[project]
name = "hpf-work-manager-backend"
version = "0.2.0"
description = "Task/Project management & progress tracking API (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.29",
    "alembic~=1.13",
    "pydantic~=2.8",
    "pydantic-settings~=2.5",
    "PyJWT~=2.9",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart~=0.0.9",
    "email-validator~=2.1",
    "mcp>=1.10,<2",
    "sse-starlette~=2.0",
    "slowapi~=0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 所有测试与 fixture 共享会话级事件循环：MCP 会话管理器（anyio task group）是
# 会话级单例且 run() 仅允许一次，跨循环访问会导致测试挂死
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
