# 生产编排：frontend(nginx) + backend(uvicorn) + postgres + backup
# 安全策略：端口仅绑定 127.0.0.1 与 Tailscale IP (100.69.225.112)，免除公网暴露风险

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hpf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hpf}
      POSTGRES_DB: ${POSTGRES_DB:-hpf_work}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hpf} -d ${POSTGRES_DB:-hpf_work}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backup:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hpf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hpf}
      POSTGRES_DB: ${POSTGRES_DB:-hpf_work}
      # pg_dump 只认 PGPASSWORD，不认 POSTGRES_PASSWORD。
      # 缺这一行会让备份静默产出 20 字节的空 gzip（2026-10-16 → 11-25 事故）。
      PGPASSWORD: ${POSTGRES_PASSWORD:-hpf}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - ./backups:/backups
    # 备份策略：先写临时文件 → 校验非空 → 再原子改名落盘。
    # 失败时不覆盖已有备份，只在日志里报错，避免「空文件顶替好文件」。
    command: >
      sh -c "
        while true; do
          ts=$$(date +%F_%H-%M-%S);
          tmp=/backups/.hpf_$${ts}.sql.gz.part;
          if pg_dump -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" | gzip > \"$$tmp\"; then
            size=$$(wc -c < \"$$tmp\");
            if [ \"$$size\" -gt 1024 ]; then
              mv \"$$tmp\" \"/backups/hpf_$${ts}.sql.gz\";
              echo \"[backup] OK hpf_$${ts}.sql.gz ($${size} bytes)\";
              find /backups -type f -name 'hpf_*.sql.gz' -mtime +7 -delete;
            else
              rm -f \"$$tmp\";
              echo \"[backup] FAILED: dump only $${size} bytes (<1024), discarded\" >&2;
            fi
          else
            rm -f \"$$tmp\";
            echo \"[backup] FAILED: pg_dump exited non-zero\" >&2;
          fi;
          sleep 86400;
        done
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  backend:
    build: ./backend
    image: hpf-work-manager-backend:${TAG:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hpf}:${POSTGRES_PASSWORD:-hpf}@postgres:5432/${POSTGRES_DB:-hpf_work}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    volumes:
      - /home/hotpotfish/dsh-workspace/projects:/workspace/projects:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  frontend:
    build: ./frontend
    image: hpf-work-manager-frontend:${TAG:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
      - "100.69.225.112:${FRONTEND_PORT:-8088}:80"
    networks:
      - app

volumes:
  pgdata:

networks:
  app:
    driver: bridge
